network:
  interface: eth0

  monitored_subnet: 10.0.2.0/24

  ignorar_equipo_local: true

admin:
  email: admin@organizacion.local

alerts:
  from_address: ids@organizacion.local
  cooldown_seconds: 300
  smtp_delay_seconds: 2

threat_intel:
  feodo_url: https://feodotracker.abuse.ch/downloads/ipblocklist.csv
  cache_file: config/blacklist.cache
  refresh_hours: 12

logging:
  database: logs/ids.db
